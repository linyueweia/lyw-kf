#==========================================================================
# 为 KICKPI K1 V1.2 (RK3568B2) 构建可启动的飞牛 fnOS ARM64 固件镜像
#
# 设计要点：
#   · 不改飞牛内核（保住文件回收站/权限管理等 FilesACL 依赖的特性）
#   · 只做三件事：换本板 DTB、注入本板所需树外模块、写对本板引导配置
#   · 引导链六环静态验证作为【硬门禁】，不过就不出产物
#   · root= 一律用镜像自身 rootfs 的 PARTUUID，绝不出现 /dev/mmcblk0* 或厂商 eMMC PARTUUID
#==========================================================================
name: Build fnOS KICKPI K1 Image

on:
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: "fnnas-base-images 的 release tag（基镜像来源）"
        required: false
        default: "v1.0.0"
        type: string
      base_image_asset:
        description: "基镜像资产名"
        required: false
        default: "fnnas-official-arm64-image_rockchip.img.gz"
        type: string
      base_image_sha256:
        description: "基镜像(解压后) sha256 —— 换基镜像版本时必须同步更新，否则装配硬失败"
        required: false
        # 取值出处：run 37843446860 的 'Fetch and unpack fnOS base image' 步骤实测
        # （v1.0.0 / fnnas-official-arm64-image_rockchip.img.gz 解压后）。
        # 注意：本地取证用的那份 base.img 实测是 d0f4d40ba82966720d6cbc39f22100192c50b9a7a4a4ba219ff5eceada61a216，
        # 与发布资产不逐字节一致（结构完全相同：KREL 6.18.18.c951-trim、header、fstab 均一致），
        # 故以 CI 实取值为准 —— 门禁挡的是「流水线会拿到的东西」。
        default: "4ad44904ee1a831ae314699a86d5b7402eb4932c18a01629efbfd78f9148ea31"
        type: string
      with_modules:
        description: "是否注入板级模块（需与基镜像内核匹配的 .ko；关闭则只验证引导链）"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "dts/**"
      - "dist/**"
      - "modules/**"
      - "*.sh"
      - ".github/workflows/**"

permissions:
  contents: write

env:
  TZ: Etc/UTC

jobs:
  build:
    name: Assemble fnOS image
    # u-boot：恒用飞牛基镜像自带引导件，不注入不覆盖（2026-10-08 实测结论）。
    # 历史：曾以仓库素材（自建 radxa 2023.10）注入 → SPL 阶段断；素材链已删除。
    runs-on: ubuntu-24.04
    env:
      # 只在这里判定一次，后面全部读这个值。
      # 踩过的坑：同一输入在三处写成不同形式 —— push 触发时 inputs.* 为空，
      # 于是「跳过模块构建」与「装配仍去找 built-modules」判断相反，装配报
      # ls: cannot access 'built-modules'。rules：dispatch 显式 with_modules=false
      # 才关，其余（含 push）一律 true。
      # 坑：push 触发时 inputs.* 为 null，而 GitHub 表达式里 ''/null == false 会返回
      # true，于是"默认开"变成"默认关"。必须按事件类型短路，别只比较 inputs。
      WITH_MODULES: ${{ github.event_name != 'workflow_dispatch' || inputs.with_modules != false }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (基镜像 + 产物 xz 需要空间)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils btrfs-progs device-tree-compiler \
                                     qemu-user-static file kmod libelf-dev flex bison \
                                     gcc-aarch64-linux-gnu

      - name: Cache fnOS base image
        id: basecache
        uses: actions/cache@v4
        with:
          path: base
          key: fnnas-base-${{ inputs.base_image_tag || 'v1.0.0' }}-${{ inputs.base_image_asset || 'fnnas-official-arm64-image_rockchip.img.gz' }}

      - name: Fetch and unpack fnOS base image
        run: |
          set -e
          TAG="${{ inputs.base_image_tag || 'v1.0.0' }}"
          ASSET="${{ inputs.base_image_asset || 'fnnas-official-arm64-image_rockchip.img.gz' }}"
          mkdir -p base
          if [[ ! -f base/fnnas-base.img ]]; then
            URL="https://github.com/linyueweia/fnnas-base-images/releases/download/${TAG}/${ASSET}"
            echo "  下载基镜像: $URL"
            curl -fL --retry 3 -o base/base.img.gz "$URL"
            gzip -t base/base.img.gz
            echo "  解压…"
            gunzip -c base/base.img.gz > base/fnnas-base.img
            rm -f base/base.img.gz
          fi
          # 基镜像来源断言（取证 A3 缺口：此前只有 gzip -t，换版/损坏无门禁）
          # 默认值 = run 37843446860 实测（CI 自己解压出来的那个字节流）
          EXPECT_SHA="${{ inputs.base_image_sha256 || '4ad44904ee1a831ae314699a86d5b7402eb4932c18a01629efbfd78f9148ea31' }}"
          if [[ -n "$EXPECT_SHA" ]]; then
            GOT="$(sha256sum base/fnnas-base.img | awk '{print $1}')"
            if [[ "$GOT" == "$EXPECT_SHA" ]]; then
              echo "  ✓ 基镜像 sha256 一致 $GOT"
            else
              echo "  ✗ 基镜像 sha256 不符"
              echo "     期望 $EXPECT_SHA"
              echo "     实得 $GOT"
              echo "     若确认是新版本基镜像，请同时更新 workflow 输入 base_image_sha256"
              exit 1
            fi
          fi
          ls -la base/
          echo "  分区表:"
          sudo parted -s base/fnnas-base.img unit s print || true

      - name: Report boot material (DTB / modules，构建前清单)
        run: |
          # 本步骤在 Assemble 之前执行：只列材料，不做产物断言。
          # （产物 DDR 断言在 Show outputs —— 此时 out/ 尚不存在。）
          echo "── u-boot：无仓库材料（恒用飞牛基镜像自带，2026-10-08 实测结论）──"
          echo "── DTB ──"; ls -la dist/
          echo "── 模块 ──"; find modules -name '*.ko' -exec ls -la {} \;

      - name: Diagnose base image kernel / headers
        run: |
          set -e
          IMG=base/fnnas-base.img
          LOOP=$(sudo losetup -fP --show "$IMG")
          sudo mkdir -p /mnt/dbg_boot /mnt/dbg_root
          sudo mount "${LOOP}p1" /mnt/dbg_boot || true
          echo "── BOOT(vmlinuz/config/System.map) ──"
          ls /mnt/dbg_boot | grep -E '^(vmlinuz|config|System.map)' | sed 's/^/   /' || true
          sudo umount /mnt/dbg_boot || true
          sudo mount "${LOOP}p2" /mnt/dbg_root || true
          echo "── rootfs: /usr/lib/modules ──"
          sudo ls /mnt/dbg_root/usr/lib/modules 2>/dev/null | sed 's/^/   /' || echo "   (无)"
          echo "── rootfs: /usr/src（内核头文件？）──"
          sudo ls /mnt/dbg_root/usr/src 2>/dev/null | sed 's/^/   /' || echo "   (无)"
          for d in $(sudo ls -d /mnt/dbg_root/usr/src/* 2>/dev/null); do
            echo "   [$d] Module.symvers=$([[ -f $d/Module.symvers ]] && echo yes || echo no) \
                  auto.conf=$([[ -f $d/include/config/auto.conf ]] && echo yes || echo no) \
                  Makefile=$([[ -f $d/Makefile ]] && echo yes || echo no)"
          done
          echo "── 模块目录内容（前 15） ──"
          for m in $(sudo ls -d /mnt/dbg_root/usr/lib/modules/* 2>/dev/null); do
            echo "   [$m]"; sudo ls "$m" | head -15 | sed 's/^/      /'
          done
          sudo umount /mnt/dbg_root || true
          sudo losetup -d "$LOOP" || true

      - name: Build board modules from base image headers
        if: env.WITH_MODULES == 'true'
        run: |
          set -e
          chmod +x build-modules.sh
          # 必须 root：脚本要 losetup 挂载镜像分区取内核头文件
          sudo -E bash build-modules.sh base/fnnas-base.img built-modules \
               https://github.com/retro98boy/seekwave-swt6621s
          ls -la built-modules/

      - name: Note module plan
        run: |
          if [[ "$WITH_MODULES" == "false" ]]; then
            echo "本阶段不注入模块：只验证引导链（DTB + 引导配置）"
          else
            echo "将注入 modules/ 下的 .ko（脚本会做 vermagic 硬闸，不匹配则失败）"
          fi

      - name: Repo static gates (eMMC 劫持 / DTB 同步 / 网口+媒体 DT 门禁)
        run: |
          set -e
          chmod +x tools/verify-repo-static.sh tools/verify-k1-net-dts.sh tools/verify-k1-media-dts.sh
          bash tools/verify-repo-static.sh

      - name: Assemble fnOS image
        run: |
          set -e
          # 【2026-10-08 实测结论·重要】不注入自建 u-boot（UBOOT_DIR 覆盖机制已删除）。
          # 实测：TF 卡冷启动电源灯亮、系统灯不亮（内核从未运行）→ 自建对在 SPL 阶段就断：
          #   本板原厂(可用) : DDR v1.23-03ea844c5d + U-Boot SPL 2017.09
          #   自建(不可用)   : DDR v1.26-5c7dbc4d49 + U-Boot 2023.10(generic-rk3568, BL31 v1.46)
          # 而飞牛基镜像自带引导件的 DDR 固件正是 ddr-v1.23-03ea844c5d，与本板 eMMC 原厂
          # 同版本同哈希 —— 基镜像的引导链本就是对的，覆盖反而坏事。
          # （自建素材链已删除；Report 步骤对产物 LBA64 的 DDR 断言保留。）
          if [[ "$WITH_MODULES" == "false" ]]; then
            MODDIR=""
            echo "  本阶段不注入模块：只验证引导链"
          else
            MODDIR=built-modules
            echo "  注入用基镜像头文件编译的模块（built-modules/）"
            ls -la "$MODDIR"
          fi
          sudo -E BASE=base/fnnas-base.img \
          DTB=dist/rk3568-kickpi-k1.dtb \
                  MODULES_DIR="$MODDIR" \
                  BUILD_NUM="${{ github.run_number }}" \
                  OUT_DIR=out \
                  bash build-k1-fnos.sh
          ls -la out/

      - name: Verify boot chain (六环硬门禁)
        run: |
          set -e
          IMG="$(ls out/*.img | head -1)"
          echo "验证镜像: $IMG"
          if [[ "$WITH_MODULES" == "false" ]]; then
            EXP=0
          else
            # WITH_MODULES 时注入 4 个：maxio + swt6621s_wifi + skw_sdio_lite + skwbt
            # （旧值 1 且 verify 脚本从不读 EXPECT_MODULES → 构建静默降级也全绿，取证 A3）
            EXP=4
          fi
          sudo -E EXPECT_MODULES="$EXP" bash verify-fnos-bootchain.sh "$IMG"

      - name: Show outputs
        run: |
          ls -la out/
          cat out/SHA256SUMS || true
          # ── 产物 u-boot 防呆断言（Assemble 之后，对象 = 真正交付的引导件）──
          # 必须 v1.23（与本板 eMMC 原厂同哈希）；拒绝 T68M V1.18 与 1056MHz 家族。
          F=$(ls out/fnos_*.img 2>/dev/null | head -1)
          if [[ -z "$F" ]]; then
            echo "::error::out/ 下没有 .img 产物（现有: $(ls out/ | tr '\n' ' ')）"
            exit 1
          fi
          dd if="$F" bs=512 skip=64 count=800 status=none 2>/dev/null > /tmp/_idb.img
          strings /tmp/_idb.img | grep -iE 'ddr.*v1\.[0-9]+|fwver' | head -2 || true
          if strings /tmp/_idb.img | grep -q 'V1.18 f366f69a7d'; then
            echo "::error::产物 idbloader 是 T68M 的 DDR V1.18，与本板 1560MHz 不匹配"
            exit 1
          fi
          if strings /tmp/_idb.img | grep -q '1056MHz'; then
            echo "::error::产物 idbloader 属 1056MHz 家族 —— 不是本板 DDR"
            exit 1
          fi
          strings /tmp/_idb.img | grep -q 'v1.23' || {
            echo "::error::产物 idbloader 非 v1.23（应与本板 eMMC 原厂同哈希）"
            exit 1
          }
          echo "  ✓ 产物引导件 = 基镜像自带 v1.23（本板验证可用）"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnos-kickpi-k1-${{ github.run_number }}
          path: |
            out/*.img.xz
            out/SHA256SUMS
          retention-days: 14
          compression-level: 0

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fnos_kickpi-k1_${{ github.run_number }}
          name: fnOS KICKPI K1 #${{ github.run_number }}
          body: |
            为 KICKPI K1 V1.2 (RK3568B2) 构建的飞牛 fnOS ARM64 镜像。
            合并：先机 DTB + 本板 maxio.ko(SWT6621S WiFi/BT 模块)
            引导链六环静态验证已通过。上机前请确认刷写目标是 SD 卡。
          files: |
            out/*.img.xz
            out/SHA256SUMS
          fail_on_unmatched_files: true
