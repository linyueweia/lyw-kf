# ⚠ 占位材料：root= 必须在装配期写成【镜像自身】的 PARTUUID。
#   绝不能写 /dev/mmcblk0* —— 那是本板 Android 布局的厂商 eMMC 分区，
#   一旦被引用就会挂到用户正在跑的厂商系统上（破坏性）。装配脚本与
#   verify-fnos-bootchain.sh 环5 都会拦截该写法。
label fnOS
    kernel /vmlinuz
    fdt /dtb/rockchip/rk3568-kickpi-k1.dtb
    append earlycon=uart8250,mmio32,0xfe660000 console=ttyS2,1500000 splash=verbose cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory cma=256M root=PARTUUID=00000000-0000-4000-8000-000000000000 rw rootwait
